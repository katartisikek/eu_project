<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TIHC — European Projects Dissemination Monitoring & Reporting Platform</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <!-- Institutional Top Header -->
  <header class="top-header">
    <div class="top-header-inner">
      <div class="brand-block">
        <div class="brand-logos">
          <img src="/uploads/inbound/image25.png" alt="TIHC Logo" title="Technical Schools of the Chamber of Heraklion (TIHC)">
          <img src="/uploads/inbound/image104.jpg" alt="Co-funded by the EU" title="Co-funded by the European Union">
        </div>
        <div class="brand-titles">
          <h1 id="headerMainTitle">TIHC Dissemination Monitoring & Reporting Platform</h1>
          <p id="headerSubTitle">Technical Schools of the Chamber of Heraklion (TIHC) — Unified Dissemination System</p>
        </div>
      </div>

      <div class="header-controls">
        <div class="control-group">
          <label for="langSelector" id="lblLangSelector">Language / Γλώσσα</label>
          <div style="display:flex; gap:4px;">
            <button type="button" id="btnLangEn" class="btn btn-sm" style="background:#ffffff; color:#1e3a8a; font-weight:800; padding:5px 10px;" onclick="setLanguage('en')">🇬🇧 EN</button>
            <button type="button" id="btnLangEl" class="btn btn-sm" style="background:rgba(255,255,255,0.15); color:#ffffff; font-weight:700; padding:5px 10px;" onclick="setLanguage('el')">🇬🇷 ΕΛ</button>
          </div>
        </div>

        <div class="control-group">
          <label for="projectSelector" id="lblProjectSelector">Active Project</label>
          <select id="projectSelector" class="header-select"></select>
        </div>

        <div class="control-group">
          <label for="userRoleSelector" id="lblUserRoleSelector">Current User / RBAC</label>
          <select id="userRoleSelector" class="header-select"></select>
        </div>

        <div id="activeRoleBadge" class="role-pill"></div>

        <div style="display:flex; align-items:flex-end;">
          <button id="authBtn" class="btn btn-sm" style="background:rgba(255,255,255,0.2); color:#fff; border:1px solid rgba(255,255,255,0.4);" onclick="handleAuthButtonClick()">🔐 Sign In</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Project Context Bar -->
  <section class="project-context-bar" id="projectContextBar"></section>

  <!-- Main Navigation Tabs -->
  <nav class="main-nav">
    <div class="main-nav-inner" id="mainNavTabs"></div>
  </nav>

  <!-- Main Workspace Container -->
  <main class="app-container" id="mainViewContainer">
    <div class="card">Loading platform data...</div>
  </main>

  <!-- Dynamic Modal Container -->
  <div id="modalRoot"></div>

  <!-- Toast Notifications -->
  <div id="toastRoot" class="toast-container"></div>

  <script src="/i18n.js"></script>
  <script src="/app.js"></script>
</body>
</html>
