# Nginx Server Block Configuration for TIHC Dissemination Platform
# Place this in /etc/nginx/sites-available/tihc-dissemination
# and symlink to /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name dissemination.katartisi.gr; # Change to your actual domain or IP

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dissemination.katartisi.gr; # Change to your actual domain or IP

    # SSL certificates (managed by certbot)
    ssl_certificate /etc/letsencrypt/live/dissemination.katartisi.gr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dissemination.katartisi.gr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Allow uploads up to 50MB for evidence PDFs & screenshots
    client_max_body_size 50M;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Proxy to Node.js application (localhost:3080)
    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }
}

